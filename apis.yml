- type: UseCases
  data:
  - name: Product Discovery
    description: Full-text search and filtering across product descriptions, specifications,
      and reviews.
  - name: Inventory Management
    description: Real-time in-store availability checking by postal code or store
      ID.
  - name: Recommendation Widgets
    description: Display trending, most-viewed, and also-bought products on product
      detail pages.
  - name: Store Locator
    description: Proximity-based store search with hours verification and service
      availability.
  - name: Open Box Sourcing
    description: Identify discounted alternatives with transparent condition ratings.
  - name: Price Monitoring
    description: Track product price changes and availability updates.
  - name: Retail Integration
    description: Build shopping experiences integrated with Best Buy's product catalog
      and fulfillment.
  - name: Affiliate Commerce
    description: Commission-based product recommendations with affiliate partner integration.
- type: Integrations
  data:
  - name: Postman
    description: Pre-built Postman collection available for testing and exploring
      Best Buy APIs.
  - name: Impact Affiliate Network
    description: Affiliate commission integration using Impact Partner ID for revenue
      attribution.
