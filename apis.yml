description: Best Buy is a multinational consumer electronics retailer offering technology
  products, services, and solutions through stores, online, and in-home consultations.
  Best Buy provides a developer API giving access to product data, store locations,
  categories, recommendations, open box offers, and commerce capabilities for partners
  and developers building retail integrations and applications.
