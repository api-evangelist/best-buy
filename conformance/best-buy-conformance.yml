certifications_published: []
certifications_note: >-
  No trust center, SOC 2, ISO 27001, PCI DSS or FedRAMP attestation is published on any Best Buy
  developer or corporate surface reachable by this pass. Best Buy is a card-accepting retailer
  and is therefore PCI-DSS-obligated, but no attestation is publicly linked, so nothing is
  asserted here.
