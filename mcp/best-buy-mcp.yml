notes:
- All eight candidate tools are read-only; the write surface (Commerce API order creation, modification and cancellation) is not publicly specified and requires a separately-issued CAPI key.
- Auth would be a query-string apiKey (see authentication/best-buy-authentication.yml), which is an awkward fit for MCP secret handling — a header-based key would be the prerequisite for a credible server.
- Rate ceiling any server must respect: 5 requests/second and 50,000 requests/day per key (see rate-limits/).
