description: >-
  Best Buy publishes NO first-party MCP server. Searched 2026-08-27: developer.bestbuy.com/mcp
  404s, api.bestbuy.com/mcp returns the blanket API-key 403, and the only "Best Buy MCP"
  servers in circulation are third-party wrappers (Composio's bestbuy toolkit, and a family of
  Apify scraper actors) that Best Buy neither publishes nor endorses. The tool list below is a
  CANDIDATE derived from the eight operations in this repo's OpenAPI — it is what a Best Buy MCP
  server would expose, not something that exists.
